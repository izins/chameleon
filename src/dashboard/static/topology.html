<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEGIS — Network Topology</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0e1a;color:#e0e0e0;overflow:hidden;height:100vh}
#header{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:rgba(10,14,26,0.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.06)}
#header h1{font-size:18px;font-weight:700;background:linear-gradient(135deg,#00d4ff,#7b61ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#header .subtitle{font-size:12px;color:#8892b0;margin-left:12px}
.stats{display:flex;gap:16px}
.stat{text-align:center;padding:4px 14px;background:rgba(255,255,255,0.04);border-radius:8px;border:1px solid rgba(255,255,255,0.06)}
.stat .val{font-size:18px;font-weight:700;color:#00d4ff}
.stat .lbl{font-size:10px;color:#8892b0;text-transform:uppercase;letter-spacing:0.5px}
.stat.danger .val{color:#ff4757}
#canvas{width:100%;height:100vh}
svg{width:100%;height:100%}
.link{stroke:rgba(100,120,180,0.25);stroke-width:1.5}
.link.isolated{stroke:#ff4757;stroke-width:2;stroke-dasharray:6,4;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-10}}
.node-group{cursor:pointer}
.node-circle{stroke-width:2;transition:all 0.3s}
.node-group:hover .node-circle{stroke-width:3;filter:brightness(1.3)}
.node-label{font-size:10px;fill:#8892b0;text-anchor:middle;pointer-events:none}
.node-type-label{font-size:8px;fill:#5a6580;text-anchor:middle;pointer-events:none;text-transform:uppercase;letter-spacing:0.5px}
.node-icon{font-size:16px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.isolated-ring{fill:none;stroke:#ff4757;stroke-width:3;opacity:0;animation:pulse-ring 2s ease-out infinite}
@keyframes pulse-ring{0%{r:22;opacity:0.8}100%{r:40;opacity:0}}
.isolated-glow{fill:none;stroke:#ff4757;stroke-width:1;opacity:0.4;filter:blur(4px)}
#tooltip{position:fixed;display:none;background:rgba(15,20,35,0.95);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:16px;min-width:260px;max-width:340px;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
#tooltip h3{font-size:14px;font-weight:600;margin-bottom:8px}
#tooltip .row{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.04)}
#tooltip .row .k{color:#8892b0}
#tooltip .row .v{color:#e0e0e0;font-weight:500}
#tooltip .badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;text-transform:uppercase}
.badge-router{background:rgba(255,107,53,0.2);color:#ff6b35}
.badge-server{background:rgba(0,212,255,0.2);color:#00d4ff}
.badge-workstation{background:rgba(123,97,255,0.2);color:#7b61ff}
.badge-infrastructure{background:rgba(255,193,7,0.2);color:#ffc107}
.badge-isolated{background:rgba(255,71,87,0.3);color:#ff4757;border:1px solid #ff4757}
#legend{position:fixed;bottom:20px;left:20px;background:rgba(15,20,35,0.9);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:16px;z-index:100}
#legend h4{font-size:11px;color:#8892b0;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.legend-item{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px}
.legend-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
#controls{position:fixed;bottom:20px;right:20px;display:flex;gap:8px;z-index:100}
#controls button{padding:8px 16px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#e0e0e0;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;transition:all 0.2s}
#controls button:hover{background:rgba(0,212,255,0.15);border-color:#00d4ff}
</style>
</head>
<body>
<div id="header">
  <div style="display:flex;align-items:center">
    <h1>🛡️ AEGIS Network Topology</h1>
    <span class="subtitle">ISO 27035 — Phase 3 Response Visualization</span>
  </div>
  <div class="stats">
    <div class="stat"><div class="val" id="s-devices">0</div><div class="lbl">Devices</div></div>
    <div class="stat"><div class="val" id="s-edges">0</div><div class="lbl">Connections</div></div>
    <div class="stat danger"><div class="val" id="s-isolated">0</div><div class="lbl">Isolated</div></div>
    <div class="stat"><div class="val" id="s-incidents">0</div><div class="lbl">Incidents</div></div>
  </div>
</div>

<div id="canvas"><svg id="graph"></svg></div>

<div id="tooltip"></div>

<div id="legend">
  <h4>Device Types</h4>
  <div class="legend-item"><div class="legend-dot" style="background:#ff6b35"></div>Router / Gateway</div>
  <div class="legend-item"><div class="legend-dot" style="background:#00d4ff"></div>Server</div>
  <div class="legend-item"><div class="legend-dot" style="background:#7b61ff"></div>Workstation</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ffc107"></div>Infrastructure</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ff4757;box-shadow:0 0 8px #ff4757"></div>Isolated (Attack)</div>
</div>

<div id="controls">
  <button onclick="rescan()">🔄 Rescan Network</button>
  <button onclick="resetZoom()">🔍 Reset View</button>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const COLORS = {router:'#ff6b35',server:'#00d4ff',workstation:'#7b61ff',infrastructure:'#ffc107',network:'#ffc107',unknown:'#5a6580'};
const ICONS = {router:'🌐',server:'🖥️',workstation:'💻',infrastructure:'⚙️',network:'🔀',unknown:'❓'};
const SIZES = {router:28,server:22,workstation:18,infrastructure:24,network:24,unknown:16};

let simulation, svg, g, linkG, nodeG, width, height, zoom;

async function loadTopology(){
  try{
    const res = await fetch('/api/network/topology');
    if(!res.ok) throw new Error('No topology');
    return await res.json();
  }catch(e){
    console.warn('Loading fallback topology');
    return null;
  }
}

function buildGraph(topo){
  if(!topo||!topo.devices) return;

  document.getElementById('s-devices').textContent=topo.total_devices||topo.devices.length;
  document.getElementById('s-edges').textContent=(topo.edges||[]).length;
  document.getElementById('s-isolated').textContent=(topo.isolated_devices||[]).length;
  document.getElementById('s-incidents').textContent=(topo.active_incidents||[]).length;

  const nodes=topo.devices.map(d=>({
    id:d.ip, ...d,
    color:COLORS[d.device_type]||COLORS.unknown,
    icon:ICONS[d.device_type]||ICONS.unknown,
    size:SIZES[d.device_type]||SIZES.unknown
  }));

  const nodeIds=new Set(nodes.map(n=>n.id));
  const links=(topo.edges||[]).filter(e=>nodeIds.has(e.source)&&nodeIds.has(e.target)).map(e=>({source:e.source,target:e.target}));

  svg=d3.select('#graph');
  width=window.innerWidth;
  height=window.innerHeight;
  svg.attr('viewBox',[0,0,width,height]);

  svg.selectAll('*').remove();

  const defs=svg.append('defs');
  // Glow filter
  const glow=defs.append('filter').attr('id','glow');
  glow.append('feGaussianBlur').attr('stdDeviation','4').attr('result','coloredBlur');
  const merge=glow.append('feMerge');
  merge.append('feMergeNode').attr('in','coloredBlur');
  merge.append('feMergeNode').attr('in','SourceGraphic');

  zoom=d3.zoom().scaleExtent([0.3,4]).on('zoom',e=>{g.attr('transform',e.transform)});
  svg.call(zoom);

  g=svg.append('g');
  linkG=g.append('g').attr('class','links');
  nodeG=g.append('g').attr('class','nodes');

  const link=linkG.selectAll('line').data(links).join('line')
    .attr('class',d=>{
      const iso=topo.isolated_devices||[];
      return iso.includes(d.source?.id||d.source)||iso.includes(d.target?.id||d.target)?'link isolated':'link';
    });

  const node=nodeG.selectAll('g').data(nodes).join('g').attr('class','node-group')
    .call(d3.drag().on('start',dragStart).on('drag',dragged).on('end',dragEnd))
    .on('mouseover',(e,d)=>showTooltip(e,d))
    .on('mouseout',()=>hideTooltip())
    .on('click',(e,d)=>showTooltip(e,d));

  // Isolated pulse ring
  node.filter(d=>d.is_isolated).append('circle').attr('class','isolated-ring').attr('r',22);
  node.filter(d=>d.is_isolated).append('circle').attr('class','isolated-glow').attr('r',d=>d.size+8);

  // Main circle
  node.append('circle').attr('class','node-circle')
    .attr('r',d=>d.size)
    .attr('fill',d=>d.is_isolated?'rgba(255,71,87,0.15)':('rgba('+hexToRgb(d.color)+',0.12)'))
    .attr('stroke',d=>d.is_isolated?'#ff4757':d.color)
    .attr('filter',d=>(d.is_gateway||d.is_isolated)?'url(#glow)':null);

  // Icon
  node.append('text').attr('class','node-icon').attr('dy','1px').text(d=>d.is_isolated?'🚨':d.icon);

  // IP label
  node.append('text').attr('class','node-label').attr('dy',d=>d.size+14).text(d=>d.ip);

  // Type label
  node.append('text').attr('class','node-type-label').attr('dy',d=>d.size+25)
    .text(d=>{
      if(d.is_isolated)return '⛔ ISOLATED';
      if(d.is_gateway)return '🌐 GATEWAY';
      if(d.is_local)return '📍 YOU';
      return d.device_role||d.device_type;
    });

  simulation=d3.forceSimulation(nodes)
    .force('link',d3.forceLink(links).id(d=>d.id).distance(120))
    .force('charge',d3.forceManyBody().strength(-400))
    .force('center',d3.forceCenter(width/2,height/2))
    .force('collision',d3.forceCollide().radius(d=>d.size+20))
    .on('tick',()=>{
      link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
          .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
      node.attr('transform',d=>`translate(${d.x},${d.y})`);
    });
}

function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

function showTooltip(event,d){
  const tip=document.getElementById('tooltip');
  const badge=d.is_isolated?'badge-isolated':('badge-'+d.device_type);
  const statusText=d.is_isolated?`<span class="badge badge-isolated">⛔ ISOLATED</span>`:`<span class="badge ${badge}">${d.device_type}</span>`;
  tip.innerHTML=`
    <h3>${d.ip} ${statusText}</h3>
    ${d.hostname?`<div class="row"><span class="k">Hostname</span><span class="v">${d.hostname}</span></div>`:''}
    <div class="row"><span class="k">Device Type</span><span class="v">${d.device_type}</span></div>
    <div class="row"><span class="k">Role</span><span class="v">${d.device_role||'—'}</span></div>
    <div class="row"><span class="k">Vendor</span><span class="v">${d.vendor||'Unknown'}</span></div>
    <div class="row"><span class="k">Criticality</span><span class="v">${d.criticality}/10</span></div>
    <div class="row"><span class="k">Business Impact</span><span class="v">${d.business_impact}</span></div>
    <div class="row"><span class="k">Subnet</span><span class="v">${d.subnet||'—'}</span></div>
    ${d.is_gateway?'<div class="row"><span class="k">Role</span><span class="v">🌐 Default Gateway</span></div>':''}
    ${d.is_local?'<div class="row"><span class="k">Note</span><span class="v">📍 This is your machine</span></div>':''}
    ${d.is_isolated?`<div class="row"><span class="k">Isolation</span><span class="v" style="color:#ff4757">${d.isolation_reason}</span></div>`:''}
    ${d.isolated_at?`<div class="row"><span class="k">Isolated At</span><span class="v">${new Date(d.isolated_at).toLocaleString()}</span></div>`:''}
    ${d.open_ports&&d.open_ports.length?`<div class="row"><span class="k">Open Ports</span><span class="v">${d.open_ports.join(', ')}</span></div>`:''}
    <div class="row"><span class="k">MAC</span><span class="v" style="font-family:monospace;font-size:11px">${d.mac||'—'}</span></div>
  `;
  tip.style.display='block';
  const x=Math.min(event.pageX+15,window.innerWidth-360);
  const y=Math.min(event.pageY+15,window.innerHeight-300);
  tip.style.left=x+'px';tip.style.top=y+'px';
}

function hideTooltip(){document.getElementById('tooltip').style.display='none'}

function dragStart(e,d){if(!e.active)simulation.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y}
function dragged(e,d){d.fx=e.x;d.fy=e.y}
function dragEnd(e,d){if(!e.active)simulation.alphaTarget(0);d.fx=null;d.fy=null}

function resetZoom(){svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity)}

async function rescan(){
  document.getElementById('s-devices').textContent='...';
  try{
    const res=await fetch('/api/network/scan',{method:'POST'});
    const topo=await res.json();
    buildGraph(topo);
  }catch(e){alert('Scan failed: '+e.message)}
}

window.addEventListener('resize',()=>{
  width=window.innerWidth;height=window.innerHeight;
  svg.attr('viewBox',[0,0,width,height]);
  if(simulation)simulation.force('center',d3.forceCenter(width/2,height/2)).alpha(0.3).restart();
});

loadTopology().then(topo=>{if(topo)buildGraph(topo)});
</script>
</body>
</html>
